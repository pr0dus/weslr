name: Tester / trial interest
description: For people interested in trying CircleForge and sharing what worked or failed.
title: "[Tester] "
labels: [tester]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for considering testing CircleForge.
        This template helps collect useful context and outcome feedback.
  - type: input
    id: profile
    attributes:
      label: What kind of user are you?
      placeholder: self-hoster / local AI tinkerer / developer / small operator
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: What environment would you test on?
      placeholder: Linux / macOS / server / laptop / local Ollama / etc.
    validations:
      required: true
  - type: textarea
    id: interest
    attributes:
      label: What part are you most interested in testing?
      placeholder: dashboard, pack workflow, artifact generation, explainability...
    validations:
      required: true
  - type: textarea
    id: pain
    attributes:
      label: What real pain point do you care about most?
      placeholder: backup confidence, service health, config sanity, log readability...
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Anything else useful to know?
      placeholder: installation blockers, expectations, constraints...
    validations:
      required: false
