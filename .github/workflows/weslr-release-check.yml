name: WESLR Release Check

on:
  push:
    paths:
      - 'interpretation.py'
      - 'weslr/**'
      - 'scripts/weslr_release_check.sh'
  pull_request:
    paths:
      - 'interpretation.py'
      - 'weslr/**'
      - 'scripts/weslr_release_check.sh'

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install WESLR release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[release]

      - name: Run WESLR release check
        run: bash scripts/weslr_release_check.sh
