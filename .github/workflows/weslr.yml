name: WESLR Release Gate

on:
  push:
    paths:
      - 'interpretation.py'
      - 'weslr/**'
      - '.github/workflows/weslr.yml'
  pull_request:
    paths:
      - 'interpretation.py'
      - 'weslr/**'
      - '.github/workflows/weslr.yml'

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run WESLR release gate
        run: python3 weslr/tests/release_gate_v1.py
