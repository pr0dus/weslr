<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500">
  <!-- WESLR X Platform Banner/Header -->
  
  <!-- Background -->
  <rect width="1500" height="500" fill="#0D1117"/>
  
  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1500" height="500" fill="url(#bgGradient)"/>
  
  <!-- W Mark - Centered left area for profile icon overlap avoidance -->
  <g transform="translate(350, 250)">
    <!-- Left oar stroke -->
    <path d="M-100,-80 L-60,-50 L-35,80 L-60,100 L-85,75 L-70,0 Z" 
          fill="#388BFF" opacity="0.9"/>
    
    <!-- Right oar stroke -->
    <path d="M100,-80 L60,-50 L35,80 L60,100 L85,75 L70,0 Z" 
          fill="#388BFF" opacity="0.9"/>
    
    <!-- Center hull/vessel curve -->
    <path d="M-35,80 Q0,115 35,80 L25,25 Q0,45 -25,25 Z" 
          fill="#388BFF"/>
    
    <!-- Governance dot -->
    <circle cx="0" cy="-90" r="16" fill="#388BFF"/>
  </g>
  
  <!-- Text - Centered to the right of the icon -->
  <g transform="translate(550, 250)">
    <!-- WESLR wordmark -->
    <text x="0" y="-30" 
          font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="72" 
          font-weight="700" 
          fill="#F0F6FC"
          letter-spacing="-0.02em">WESLR</text>
    
    <!-- Tagline -->
    <text x="0" y="40" 
          font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="24" 
          font-weight="400" 
          fill="#C9D1D9"
          letter-spacing="0.01em">Governed continuity-first intelligence</text>
  </g>
  
  <!-- Safe zone indicator (left 200px reserved for profile icon overlay) -->
  <!-- Note: Critical content is right of x=200 -->
  
  <!-- Footer text -->
  <text x="750" y="480" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="14" 
        font-weight="400" 
        fill="#8B949E"
        text-anchor="middle">Pilot access by invitation</text>
</svg>