<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500">
  <!-- WESLR X Platform Banner/Header -->
  <!-- Canonical sharp geometric W monogram -->
  <!-- Dark background, white W, minimal text -->
  
  <!-- Background -->
  <rect width="1500" height="500" fill="#0D1117"/>
  
  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1500" height="500" fill="url(#bgGradient)"/>
  
  <!-- W Mark - Left side, profile icon safe zone -->
  <g transform="translate(300, 250) scale(0.65)">
    <!-- Sharp geometric W with extended upper tips -->
    <path d="M-180,-180 L-120,-180 L-60,80 L0,-20 L60,80 L120,-180 L180,-180 L100,180 L60,180 L0,60 L-60,180 L-100,180 Z" 
          fill="#FFFFFF"/>
  </g>
  
  <!-- Text - Right of profile icon safe zone (x > 200) -->
  <g transform="translate(520, 250)">
    <!-- WESLR wordmark -->
    <text x="0" y="-20" 
          font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="68" 
          font-weight="700" 
          fill="#F0F6FC"
          letter-spacing="-0.02em">WESLR</text>
    
    <!-- Tagline -->
    <text x="0" y="50" 
          font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="20" 
          font-weight="400" 
          fill="#8B949E"
          letter-spacing="0.01em">Governed continuity-first intelligence</text>
  </g>
</svg>