<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WESLR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0f;
      color: #e8e8ec;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 640px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: #1c1c22;
      border-bottom-right-radius: 4px;
    }

    .weslr {
      align-self: flex-start;
      background: #18181e;
      border-bottom-left-radius: 4px;
    }

    .error {
      align-self: flex-start;
      background: #2a1a1a;
      color: #e88;
      border-bottom-left-radius: 4px;
    }

    #input-row {
      padding: 12px 16px 16px;
      display: flex;
      gap: 8px;
    }

    #msg {
      flex: 1;
      background: #18181e;
      border: 1px solid #2a2a32;
      border-radius: 10px;
      color: #e8e8ec;
      font-size: 15px;
      padding: 10px 14px;
      outline: none;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }

    #msg:focus { border-color: #3a3a48; }

    #send {
      background: #242430;
      border: 1px solid #2e2e3a;
      border-radius: 10px;
      color: #a0a0b0;
      cursor: pointer;
      font-size: 14px;
      padding: 10px 16px;
      white-space: nowrap;
    }

    #send:hover { background: #2c2c3a; color: #c0c0d0; }
    #send:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>

<div id="chat"></div>

<div id="input-row">
  <textarea id="msg" rows="1" placeholder="Ask anything..."></textarea>
  <button id="send" disabled>Send</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const msgInput = document.getElementById('msg');
  const sendBtn = document.getElementById('send');

  let sending = false;

  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function appendMsg(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chat.appendChild(div);
    scrollBottom();
  }

  function setInputEnabled(on) {
    msgInput.disabled = !on;
    sendBtn.disabled = !on || sending;
  }

  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || sending) return;

    sending = true;
    setInputEnabled(false);
    appendMsg(text, 'user');
    msgInput.value = '';

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      const reply = data.reply || data.error || 'No response.';
      appendMsg(reply, 'weslr');
    } catch (e) {
      appendMsg('Connection error.', 'error');
    } finally {
      sending = false;
      setInputEnabled(true);
      msgInput.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);

  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  });

  // Init
  msgInput.focus();
  sendBtn.disabled = false;
</script>

</body>
</html>
